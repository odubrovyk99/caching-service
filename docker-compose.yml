# Values come from a .env file next to this file (or the shell), with local-dev defaults.
# The same POSTGRES_* names configure both the postgres image and the service.
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-caching}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caching}
  POSTGRES_DB: ${POSTGRES_DB:-caching}

x-app-env: &app-env
  <<: *db-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment: *db-env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrations:
    build: .
    image: caching-service:local
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  caching-service:
    build: .
    image: caching-service:local
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  pg_data:
