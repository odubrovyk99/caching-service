shell: bash

commands:
  activate-venv:
    description: Activate the virtual environment
    cmd: |
      if [[ ! -d ".venv" ]]; then
        echo "[ERROR] The virtual environment directory '.venv' does not exist." >&2
      fi
      source .venv/bin/activate
      echo "Using virtual environment: $(which python)"

  ruff:
    description: Run ruff linter
    depends:
      - activate-venv
    cmd: uv run ruff check .

  mypy:
    description: Run mypy type checks
    depends:
      - activate-venv
    cmd: uv run mypy caching_service cache_cli migrations/env.py

  black:
    description: Check formatting with black
    depends:
      - activate-venv
    cmd: uv run black --check .

  lint:
    description: Run all linters
    depends:
      - mypy
      - ruff
      - black

  test:
    description: Run tests with coverage (integration tests need Docker for testcontainers)
    options: |
      Usage:
        lets test [--path=<path>]
      Options:
        --path=<path>, -p  Path to test files or directories (default: "tests/")
    depends:
      - activate-venv
    # The 90% threshold (pyproject.toml) applies to full runs only; a run limited by --path skips it.
    cmd: uv run pytest -vv --cov --cov-report=term ${LETSOPT_PATH:+--cov-fail-under=0} "${LETSOPT_PATH:-tests/}"

  audit:
    description: Check dependencies for known vulnerabilities with pip-audit
    depends:
      - activate-venv
    # --skip-editable: the project itself is not on PyPI, so there is nothing to audit for it.
    cmd: uv run pip-audit --skip-editable

  run:
    description: Build and start postgres, migrations and the service on :8000
    options: |
      Usage:
        lets run [--env=<env>]
      Options:
        --env=<env>, -E  Env file with POSTGRES_* / LOG_LEVEL (default: ./.env if present)
    cmd: docker compose ${LETSOPT_ENV:+--env-file "$LETSOPT_ENV"} up --build

  stop:
    description: Stop the compose stack (keeps the database volume)
    cmd: docker compose down

  alembic-upgrade:
    description: Apply migrations to the database configured by POSTGRES_* env vars
    depends:
      - activate-venv
    cmd: uv run alembic upgrade head

  alembic-revision:
    description: Autogenerate a migration against the database configured by POSTGRES_* env vars
    options: |
      Usage:
        lets alembic-revision --message=<message>
      Options:
        --message=<message>, -m  Migration message
    depends:
      - activate-venv
    cmd: uv run alembic revision --autogenerate -m "${LETSOPT_MESSAGE}"
